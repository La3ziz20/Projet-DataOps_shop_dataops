version: 1
dataset: orders
columns:
  order_id:
    not_null: true
    unique: true
  order_date:
    not_null: true
    type: date
  customer_id:
    not_null: true
  country:
    not_null: true
    allowed_values:
      - France
      - Germany
      - Italy
      - Morocco
      - Tunisia
  product:
    not_null: true
  quantity:
    not_null: true
    min: 1
    type: integer
  unit_price:
    not_null: true
    min: 0.01
    max: 1000.0
    type: float
