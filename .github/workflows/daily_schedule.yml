name: Daily Scheduled DataOps Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Target date (YYYY-MM-DD), leave empty for today"
        required: false
        default: ""
      orders_path:
        description: "Path to orders CSV (leave empty to auto-generate daily orders)"
        required: false
        default: ""

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
      ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore DuckDB cache
        uses: actions/cache@v3
        with:
          path: warehouse/shop.duckdb
          key: duckdb-${{ runner.os }}-${{ hashFiles('warehouse/shop.duckdb') }}
          restore-keys: |
            duckdb-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed historical 5 valid days
        run: python orchestration/flow.py --all-valid-days

      - name: Run today
        run: python orchestration/flow.py

      - name: Run custom inputs if provided
        if: ${{ github.event.inputs.run_date != '' && github.event.inputs.orders_path != '' }}
        run: python orchestration/flow.py --date "${{ github.event.inputs.run_date }}" --orders "${{ github.event.inputs.orders_path }}"

      - name: Save DuckDB cache
        uses: actions/cache@v3
        with:
          path: warehouse/shop.duckdb
          key: duckduckdb-${{ runner.os }}-${{ hashFiles('warehouse/shop.duckdb') }}
