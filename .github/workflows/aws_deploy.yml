name: Deploy to AWS (GHCR + ECS/EC2)

on:
  workflow_dispatch:
    inputs:
      confirm_budget_alert:
        description: "Type 'BUDGET_ALERT_SET' after creating your AWS Budget Alert in the AWS Console"
        required: true
        default: ""

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_budget_alert == 'BUDGET_ALERT_SET' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shop-dataops:latest

      - name: Deploy container to AWS (requires AWS Secrets in GitHub Settings)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Image published to ghcr.io/${{ github.repository_owner }}/shop-dataops:latest"
          echo "Ready for AWS ECS/EC2 pull using GitHub Secrets (zero keys in repo)."
