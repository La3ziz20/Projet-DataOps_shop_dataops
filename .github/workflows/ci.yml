name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest unit, contract, advisor, and alerting tests
        run: python -m pytest

      - name: Ingest all 5 valid sample days and run dbt build
        run: |
          python orchestration/flow.py --all-valid-days
          dbt build --project-dir dbt --profiles-dir dbt
