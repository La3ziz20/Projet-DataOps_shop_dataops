name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest unit and data contract tests
        run: python -m pytest

      - name: Seed sample orders and FX into DuckDB and run dbt build
        run: |
          python orchestration/flow.py --date 2026-10-05 --orders data/raw/orders_day1.csv
          dbt build --project-dir dbt --profiles-dir dbt
